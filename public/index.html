<!-- ===================== API-КЛИЕНТ ===================== -->
<script>
  window.API = {
    base: '/api',
    token() { return localStorage.getItem('token'); },
    setToken(t) { t ? localStorage.setItem('token', t) : localStorage.removeItem('token'); },
    async req(path, { method = 'GET', body, headers = {} } = {}) {
      const h = { ...headers };
      if (body && !(body instanceof FormData)) h['Content-Type'] = 'application/json';
      const t = this.token();
      if (t) h['Authorization'] = `Bearer ${t}`;
      const res = await fetch(this.base + path, {
        method, headers: h,
        body: body instanceof FormData ? body : (body ? JSON.stringify(body) : undefined),
      });
      if (res.status === 401) { this.setToken(null); window.dispatchEvent(new Event('auth:logout')); }
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || 'Ошибка запроса');
      }
      return res.status === 204 ? null : res.json();
    },
    login: (email, password) => API.req('/auth/login', { method:'POST', body:{ email, password } }),
    me: () => API.req('/auth/me'),
    listArtworks: (f = {}) => {
      const q = new URLSearchParams(Object.entries(f).filter(([,v]) => v !== undefined && v !== null && v !== '')).toString();
      return API.req('/artworks' + (q ? '?' + q : ''));
    },
    getArtwork: (slug) => API.req(`/artworks/${slug}`),
    createArtwork: (d) => API.req('/artworks', { method:'POST', body:d }),
    updateArtwork: (id, d) => API.req(`/artworks/${id}`, { method:'PUT', body:d }),
    deleteArtwork: (id) => API.req(`/artworks/${id}`, { method:'DELETE' }),
    listTechniques: () => API.req('/techniques'),
    createTechnique: (d) => API.req('/techniques', { method:'POST', body:d }),
    deleteTechnique: (id) => API.req(`/techniques/${id}`, { method:'DELETE' }),
    getAbout: () => API.req('/about'),
    updateAbout: (d) => API.req('/about', { method:'PUT', body:d }),
    getContacts: () => API.req('/contacts'),
    updateContacts: (d) => API.req('/contacts', { method:'PUT', body:d }),
    upload: async (file) => {
      const fd = new FormData(); fd.append('file', file);
      return API.req('/uploads', { method:'POST', body: fd });
    }
  };
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, createContext, useContext, useRef } = React;

/* ============== Роутер ============== */
function useRoute() {
  const [route, setRoute] = useState(parseHash());
  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return route;
}
function parseHash() { return window.location.hash.replace(/^#/, '') || '/'; }
function navigate(path) { window.location.hash = path; window.scrollTo({ top:0, behavior:'smooth' }); }

/* ============== Иконки ============== */
const Icon = {
  Menu: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>,
  Close: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg>,
  Arrow: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>,
  ArrowLeft: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>,
  Lock: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>,
  Check: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M5 13l4 4L19 7"/></svg>,
};

/* ============== Store через API ============== */
const StoreCtx = createContext(null);
function useStore() { return useContext(StoreCtx); }

function StoreProvider({ children }) {
  const [artworks, setArtworks] = useState([]);
  const [techniques, setTechniques] = useState([]);
  const [about, setAbout] = useState({});
  const [contacts, setContacts] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const loadAll = async () => {
    try {
      setLoading(true);
      const [a, t, ab, c] = await Promise.all([
        API.listArtworks(),
        API.listTechniques(),
        API.getAbout(),
        API.getContacts(),
      ]);
      setArtworks(a); setTechniques(t); setAbout(ab); setContacts(c);
      setError(null);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  useEffect(() => { loadAll(); }, []);

  const api = {
    loading, error,
    artworks, techniques, about, contacts,
    refresh: loadAll,

    listArtworks: (filters = {}) => {
      let list = [...artworks];
      if (filters.category) list = list.filter(a => a.category === filters.category);
      if (filters.technique) list = list.filter(a => (a.techniques||[]).includes(filters.technique));
      if (filters.year) list = list.filter(a => a.year === Number(filters.year));
      if (filters.available === true) list = list.filter(a => a.status === 'available');
      if (filters.featured) list = list.filter(a => a.featured);
      return list;
    },
    getArtwork: (slug) => artworks.find(a => a.slug === slug),

    createArtwork: async (data) => {
      const created = await API.createArtwork(data);
      setArtworks(prev => [created, ...prev]);
      return created;
    },
    updateArtwork: async (id, data) => {
      const updated = await API.updateArtwork(id, data);
      setArtworks(prev => prev.map(a => a.id === id ? updated : a));
      return updated;
    },
    deleteArtwork: async (id) => {
      await API.deleteArtwork(id);
      setArtworks(prev => prev.filter(a => a.id !== id));
    },

    createTechnique: async (t) => {
      const created = await API.createTechnique(t);
      setTechniques(prev => [...prev, created]);
    },
    deleteTechnique: async (id) => {
      await API.deleteTechnique(id);
      setTechniques(prev => prev.filter(t => t.id !== id));
    },

    setAbout: async (data) => { const saved = await API.updateAbout(data); setAbout(saved); },
    setContacts: async (data) => { const saved = await API.updateContacts(data); setContacts(saved); },
  };

  return <StoreCtx.Provider value={api}>{children}</StoreCtx.Provider>;
}

/* ============== Header ============== */

              </button>
            ))}

              <Icon.Lock className="w-4 h-4"/> Админка

}

/* ============== Общие UI ============== */
function StatusBadge({ status }) {
  const map = {
    available:    { label:'Доступно',    cls:'bg-emerald-50 text-emerald-800 border-emerald-200' },
    sold:         { label:'Продано',     cls:'bg-red-50 text-red-800 border-red-200' },
    not_for_sale: { label:'Не продаётся', cls:'bg-neutral-100 text-neutral-600 border-neutral-200' },
  };
  const s = map[status] || map.not_for_sale;
  return <span className={`inline-flex items-center text-[11px] tracking-wider uppercase px-2.5 py-1 rounded-full border ${s.cls}`}>{s.label}</span>;
}

function LazyImage({ src, alt, className = '', ratio }) {
  const ref = useRef(null);
  const [loaded, setLoaded] = useState(false);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); io.disconnect(); }
    }, { rootMargin:'200px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <div ref={ref} className={`relative overflow-hidden bg-neutral-200 ${className}`} style={ratio ? { aspectRatio: ratio } : undefined}>
      {visible && src && (
        <img src={src} alt={alt} loading="lazy"
          onLoad={() => setLoaded(true)}
          className={`w-full h-full object-cover transition-opacity duration-700 ${loaded ? 'opacity-100' : 'opacity-0'}`}
        />
      )}
    </div>
  );
}

function ArtworkCard({ artwork, onClick }) {

          <div className="text-sm text-muted mt-1">
            {artwork.year}
            {artwork.techniqueNames?.length ? <> · {artwork.techniqueNames.join(', ')}</> : null}

          {(artwork.height || artwork.width) && (
            <div className="text-xs text-muted mt-0.5">{artwork.height}×{artwork.width} см</div>

        </div>
        {artwork.status === 'available' && artwork.price && (
          <div className="text-sm whitespace-nowrap">{artwork.price} {artwork.currency}</div>
        )}
      </div>
    </article>
  );
}

function SeriesPage() {
  const store = useStore();

  const groups = useMemo(() => {
    const map = {};
    store.artworks.forEach(a => {
      const key = (a.series || '').trim();
      if (!key) return;
      (map[key] ||= []).push(a);
    });
    // Сортируем серии по алфавиту
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
  }, [store.artworks]);

  const withoutSeries = store.artworks.filter(a => !(a.series || '').trim());

  return (
    <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-16">
      <SectionTitle
        eyebrow="Каталог"
        title="Серии"
        subtitle="Работы, объединённые художником в авторские серии."
      />

      {groups.length === 0 && (
        <div className="text-center py-24">
          <div className="font-display text-3xl mb-4">Серий пока нет</div>
          <p className="text-muted max-w-md mx-auto">
            Чтобы создать серию, откройте работу в админке и заполните поле «Серия».
            Например: «Портовые этюды».
          </p>
        </div>
      )}

      <div className="space-y-24">
        {groups.map(([seriesName, items]) => (
          <div key={seriesName}>
            <div className="flex items-baseline justify-between border-b hairline pb-3 mb-8">
              <h3 className="font-display text-3xl md:text-4xl">{seriesName}</h3>
              <div className="text-sm text-muted">
                {items.length} {items.length === 1 ? 'работа' : items.length < 5 ? 'работы' : 'работ'}
              </div>
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-14">
              {items.map(a => (
                <ArtworkCard
                  key={a.id}
                  artwork={a}
                  onClick={() => navigate(`/artworks/${a.slug}`)}
                />
              ))}
            </div>
          </div>
        ))}
      </div>

      {withoutSeries.length > 0 && groups.length > 0 && (
        <div className="mt-24 pt-12 border-t hairline">
          <div className="text-sm text-muted">
            Работы вне серий: <span className="text-ink">{withoutSeries.length}</span>
          </div>
        </div>
      )}

  );
}
/* ============== КАРТОЧКА ПРОИЗВЕДЕНИЯ ============== */
function ArtworkPage({ slug }) {
  const store = useStore();
  const a = store.getArtwork(slug);
  const [activeIdx, setActiveIdx] = useState(0);
  const [lightbox, setLightbox] = useState(false);
  useEffect(() => { setActiveIdx(0); }, [slug]);

  // Динамический title и meta description
  useEffect(() => {
    if (!a) return;

    const previousTitle = document.title;
    const previousDescription =
      document.querySelector('meta[name="description"]')?.getAttribute('content') || '';

    // Формируем title
    const title = a.metaTitle
      ? a.metaTitle
      : `${a.title}${a.year ? `, ${a.year}` : ''}${
          a.techniqueNames?.length ? ` — ${a.techniqueNames.join(', ')}` : ''
        } | ${a.artist || 'Portfolio'}`;

    // Формируем description
    const description = a.metaDescription
      ? a.metaDescription
      : (a.description || `${a.title} — работа ${a.year || ''}`).slice(0, 160);

    document.title = title;

    // meta description
    let metaDesc = document.querySelector('meta[name="description"]');
    if (!metaDesc) {
      metaDesc = document.createElement('meta');
      metaDesc.setAttribute('name', 'description');
      document.head.appendChild(metaDesc);
    }
    metaDesc.setAttribute('content', description);

    // OpenGraph (для превью в соцсетях)
    const setOg = (property, content) => {
      let el = document.querySelector(`meta[property="${property}"]`);
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute('property', property);
        document.head.appendChild(el);
      }
      el.setAttribute('content', content);
    };

    setOg('og:title', title);
    setOg('og:description', description);
    setOg('og:type', 'website');
    if (a.images?.[0]?.url) {
      setOg('og:image', a.images[0].url.startsWith('http')
        ? a.images[0].url
        : window.location.origin + a.images[0].url);
    }

    return () => {
      document.title = previousTitle;
      metaDesc.setAttribute('content', previousDescription);
    };
  }, [a]);

  if (!a) return (
    <div className="max-w-3xl mx-auto py-32 text-center">
      <h1 className="font-display text-4xl mb-4">Работа не найдена</h1>
      <button onClick={() => navigate('/')} className="text-accent hover:underline">На главную</button>
    </div>
  );

  const images = Array.isArray(a.images) ? a.images.filter(img => img && img.url) : [];
  const cover = images[activeIdx] || images[0] || { url: '', alt: a.title };
  const all = store.listArtworks({ category: a.category });
  const idx = all.findIndex(x => x.id === a.id);
  const prev = idx > 0 ? all[idx-1] : null;
  const next = idx >= 0 && idx < all.length-1 ? all[idx+1] : null;

const spec = [
  ['Автор', a.artist],
  ['Год', a.year],
  ['Техника', a.techniqueNames?.join(', ')],
  ['Материал', a.materials || a.printMaterial],
  a.category === 'engraving' ? ['Размер листа', `${a.sheetHeight}×${a.sheetWidth} см`] : null,
  a.category === 'engraving' ? ['Размер изображения', `${a.imageHeight}×${a.imageWidth} см`] : null,
  a.category !== 'engraving' ? ['Размер', `${a.height}×${a.width} см`] : null,
  a.category === 'engraving' ? ['Тираж', a.edition] : null,
  a.category === 'engraving' ? ['Номер экземпляра', a.copyNumber] : null,
  a.category === 'engraving' ? ['Подпись', a.signed] : null,
  a.category === 'reproduction' ? ['Оригинал', a.originalTitle] : null,
  a.category === 'reproduction' ? ['Тип репродукции', a.reproductionType] : null,
].filter(item => item && item[1]);

  return (
    <div className="fade-in">
      <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-10">
        <div className="flex items-center justify-between mb-8">
          <button onClick={() => navigate(-1)} className="text-sm text-muted inline-flex items-center gap-2 hover:text-ink">
            <Icon.ArrowLeft className="w-4 h-4"/> Назад
          </button>
          <div className="text-xs text-muted uppercase tracking-widest">
            {a.category === 'original' ? 'Оригинал' : a.category === 'engraving' ? 'Гравюра' : 'Репродукция'}
          </div>
        </div>
      </div>

      <div className="max-w-[1400px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-12">
        <div className="lg:col-span-8">
          <div className="artwork-frame bg-neutral-100 cursor-zoom-in" onClick={() => setLightbox(true)}>
            <LazyImage src={cover.url} alt={cover.alt || a.title} ratio={a.height && a.width ? `${a.width}/${a.height}` : '4/5'} />
          </div>
          {a.images.length > 1 && (
            <div className="mt-4 grid grid-cols-5 gap-3">
              {a.images.map((img, i) => (
                <button key={i} onClick={() => setActiveIdx(i)}
                  className={`overflow-hidden border-2 transition ${i===activeIdx?'border-ink':'border-transparent opacity-70 hover:opacity-100'}`}>
                  <LazyImage src={img.url} alt={img.alt} ratio="1/1" />
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="lg:col-span-4">
          <div className="lg:sticky lg:top-28">
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted">{a.artist}</div>
            <h1 className="font-display text-4xl md:text-5xl mt-3 leading-[1.05]">{a.title}</h1>
            <div className="mt-4 flex items-center gap-4">
              <StatusBadge status={a.status} />
              {a.status === 'available' && a.price && <div className="text-lg">{a.price} {a.currency}</div>}
            </div>
            <p className="mt-8 text-muted leading-relaxed">{a.description}</p>

            <dl className="mt-10 divide-y hairline border-t hairline">
              {spec.map(([k,v], i) => (
                <div key={i} className="py-3 grid grid-cols-3 gap-4 text-sm">
                  <dt className="text-muted">{k}</dt>
                  <dd className="col-span-2">{v}</dd>
                </div>
              ))}
            </dl>

            {a.category === 'reproduction' && a.availableSizes?.length > 0 && (
              <div className="mt-8 border-t hairline pt-6">
                <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-4">Доступные размеры</div>
                <div className="space-y-3">
                  {a.availableSizes.map((s, i) => (
                    <div key={i} className="flex items-center justify-between border hairline rounded-xl px-4 py-3">
                      <div className="text-sm">{s.label}</div>
                      <div className="text-sm">{s.price} {a.currency}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {a.status === 'available' && (
              <button
                onClick={() => navigate(`/contacts?artwork=${encodeURIComponent(a.slug)}&title=${encodeURIComponent(a.title)}`)}
                className="mt-8 w-full bg-ink text-paper py-4 rounded-full hover:bg-accent transition"
              >
                Запросить работу
              </button>
            )}

            {(prev || next) && (
              <div className="mt-12 pt-8 border-t hairline grid grid-cols-2 gap-6">
                {prev ? (
                  <button onClick={() => navigate(`/artworks/${prev.slug}`)} className="text-left group">
                    <div className="text-[10px] uppercase tracking-widest text-muted mb-2">← Предыдущая</div>
                    <div className="font-display text-lg group-hover:text-accent transition">{prev.title}</div>
                  </button>
                ) : <div />}
                {next ? (
                  <button onClick={() => navigate(`/artworks/${next.slug}`)} className="text-right group">
                    <div className="text-[10px] uppercase tracking-widest text-muted mb-2">Следующая →</div>
                    <div className="font-display text-lg group-hover:text-accent transition">{next.title}</div>
                  </button>
                ) : <div />}
              </div>
            )}
          </div>
        </div>
      </div>

      {lightbox && (
        <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6" onClick={() => setLightbox(false)}>
          <button className="absolute top-6 right-6 text-white p-2" onClick={() => setLightbox(false)}>
            <Icon.Close className="w-8 h-8"/>
          </button>
          <img src={cover.url} alt={cover.alt} className="max-w-full max-h-full object-contain" />
        </div>
      )}
    </div>
  );
}

/* ============== КОНТАКТЫ ============== */
function ContactsPage() {
  const { contacts } = useStore();
  const route = useRoute();

  // Читаем параметры из URL: /contacts?artwork=slug&title=Название
  const params = useMemo(() => {
    const q = route.split('?')[1] || '';
    return new URLSearchParams(q);
  }, [route]);

  const artworkSlug = params.get('artwork') || '';
  const artworkTitle = params.get('title') || '';

  const [form, setForm] = useState({
    name: '',
    email: '',
    message: artworkTitle
      ? `Здравствуйте! Интересует работа «${artworkTitle}». ` +
        `Пожалуйста, расскажите об условиях приобретения.`
      : '',
    artwork: artworkSlug,          // slug работы уйдёт на сервер
  });
  const [sent, setSent] = useState(false);
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);

  // Если пользователь открыл /contacts?artwork=... — обновляем поле сообщения
  useEffect(() => {
    if (artworkTitle) {
      setForm(f => ({
        ...f,
        artwork: artworkSlug,
        message: f.message || (
          `Здравствуйте! Интересует работа «${artworkTitle}». ` +
          `Пожалуйста, расскажите об условиях приобретения.`
        ),
      }));
    }
  }, [artworkSlug, artworkTitle]);

  const submit = async (e) => {
    e.preventDefault();
    const errs = {};
    if (!form.name.trim()) errs.name = 'Укажите имя';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) errs.email = 'Некорректный e-mail';
    if (form.message.trim().length < 5) errs.message = 'Сообщение слишком короткое';
    setErrors(errs);
    if (Object.keys(errs).length) return;

    setBusy(true);
    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.name,
          email: form.email,
          message: form.message,
          artwork: form.artwork || null,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'Не удалось отправить');
      }
      setSent(true);
      setForm({ name:'', email:'', message:'', artwork: '' });
    } catch (err) {
      setErrors({ form: err.message });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-16">
      <SectionTitle
        eyebrow="Контакты"
        title="Напишите нам"
        subtitle={artworkTitle
          ? `Запрос по работе «${artworkTitle}».`
          : 'Отвечаю в течение 1–2 рабочих дней.'}
      />

      {/* Плашка «вы запрашиваете работу» */}
      {artworkTitle && !sent && (
        <div className="mb-8 border hairline rounded-2xl px-5 py-4 bg-white/60 flex items-center gap-4">
          <div className="w-2 h-2 rounded-full bg-accent"></div>
          <div className="text-sm">
            Вы запрашиваете работу: <span className="font-medium">{artworkTitle}</span>
          </div>
          <button
            type="button"
            onClick={() => navigate('/contacts')}
            className="ml-auto text-xs text-muted hover:text-ink"
          >
            Сбросить
          </button>
        </div>
      )}

      <div className="grid lg:grid-cols-12 gap-16">
        <div className="lg:col-span-5 space-y-8">
          <div>
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-2">E-mail</div>
            <a href={`mailto:${contacts.email||''}`} className="font-display text-2xl hover:text-accent transition">{contacts.email}</a>
          </div>
          {contacts.instagram && (
            <div>
              <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-2">Instagram</div>
              <a href={contacts.instagramUrl} className="font-display text-2xl hover:text-accent transition">{contacts.instagram}</a>
            </div>
          )}
          {contacts.telegram && (
            <div>
              <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-2">Telegram</div>
              <div className="font-display text-2xl">{contacts.telegram}</div>
            </div>
          )}
          <div>
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-2">Студия</div>
            <div className="font-display text-2xl">{contacts.city}</div>
          </div>
        </div>

        <div className="lg:col-span-7">
          {sent ? (
            <div className="border hairline rounded-2xl p-10 text-center bg-white/50">
              <div className="w-12 h-12 mx-auto rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mb-5">
                <Icon.Check className="w-6 h-6"/>
              </div>
              <div className="font-display text-3xl">Спасибо!</div>
              <p className="text-muted mt-3">Сообщение отправлено.</p>
              <button onClick={() => { setSent(false); navigate('/contacts'); }} className="mt-6 text-sm text-accent hover:underline">
                Отправить ещё
              </button>
            </div>
          ) : (
            <form onSubmit={submit} className="space-y-6" noValidate>
              <Field label="Имя" value={form.name} onChange={v => setForm({...form, name:v})} error={errors.name} />
              <Field label="E-mail" type="email" value={form.email} onChange={v => setForm({...form, email:v})} error={errors.email} />
              <Field label="Сообщение" textarea value={form.message} onChange={v => setForm({...form, message:v})} error={errors.message} />
              {errors.form && <div className="text-sm text-red-600">{errors.form}</div>}
              <button
                type="submit"
                disabled={busy}
                className="inline-flex items-center gap-3 bg-ink text-paper px-8 py-4 rounded-full hover:bg-accent transition disabled:opacity-50"
              >
                {busy ? 'Отправка…' : 'Отправить'} <Icon.Arrow className="w-4 h-4"/>
              </button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, error, textarea, type='text' }) {
  const cls = `w-full bg-transparent border-b ${error?'border-red-400':'border-[rgba(26,26,26,.25)]'} focus:border-ink outline-none py-3 transition`;
  return (
    <label className="block">
      <span className="text-[11px] uppercase tracking-[0.3em] text-muted">{label}</span>
      <div className="mt-2">
        {textarea
          ? <textarea rows="5" className={cls} value={value} onChange={e => onChange(e.target.value)} />
          : <input type={type} className={cls} value={value} onChange={e => onChange(e.target.value)} />}
      </div>
      {error && <span className="text-xs text-red-600 mt-1 block">{error}</span>}
    </label>
  );
}

/* ============== АДМИНКА ============== */
function AdminPage() {
  const [authed, setAuthed] = useState(() => !!API.token());
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    let alive = true;
    if (API.token()) {
      API.me()
        .then(() => { if (alive) setAuthed(true); })
        .catch(() => { API.setToken(null); if (alive) setAuthed(false); })
        .finally(() => { if (alive) setChecking(false); });
    } else setChecking(false);
    return () => { alive = false; };
  }, []);

  if (checking) return <div className="py-32 text-center text-muted">Проверка доступа…</div>;
  if (!authed) return <AdminLogin onLogin={() => setAuthed(true)} />;
  return <AdminPanel onLogout={() => { API.setToken(null); setAuthed(false); }} />;
}

function AdminLogin({ onLogin }) {
  const [email, setEmail] = useState('admin@studio.art');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      const { token } = await API.login(email, password);
      API.setToken(token);
      onLogin();
    } catch (e) { setErr(e.message || 'Не удалось войти'); }
    finally { setBusy(false); }
  };

  return (
    <div className="min-h-[70vh] flex items-center justify-center px-6">
      <form onSubmit={submit} className="w-full max-w-md border hairline rounded-2xl p-10 bg-white/60">
        <div className="w-12 h-12 rounded-full bg-ink text-paper flex items-center justify-center mb-6">
          <Icon.Lock className="w-5 h-5"/>
        </div>
        <h1 className="font-display text-3xl">Админ-панель</h1>

function ArtworkForm({ initial, onClose, onSave }) {
  const store = useStore();
  const empty = {
  slug:'', artist:'Анна Морозова', title:'', year: new Date().getFullYear(),
  category:'original', techniques:[], materials:'', height:0, width:0,
  description:'', status:'available', price:null, currency:'EUR',
  images:[{ url:'', alt:'' }], featured:false,
  sheetHeight:0, sheetWidth:0, imageHeight:0, imageWidth:0,
  edition:null, copyNumber:'', signed:'',
  metaTitle:'', metaDescription:'',    // ← добавили
  series:'',
};
  const [form, setForm] = useState(initial ? { ...empty, ...initial } : empty);
  const [busy, setBusy] = useState(false);
  const set = (k,v) => setForm(f => ({ ...f, [k]:v }));

  const toggleTech = (slug) => setForm(f => ({
    ...f,
    techniques: f.techniques.includes(slug) ? f.techniques.filter(x => x!==slug) : [...f.techniques, slug]
  }));

  const addImage = () => setForm(f => ({ ...f, images: [...f.images, { url:'', alt:'' }] }));
  const updateImage = (i, k, v) => setForm(f => ({ ...f, images: f.images.map((img, idx) => idx===i ? { ...img, [k]:v } : img) }));
  const removeImage = (i) => setForm(f => ({ ...f, images: f.images.filter((_, idx) => idx !== i) }));
  const moveImage = (i, dir) => setForm(f => {
    const arr = [...f.images]; const j = i + dir;
    if (j < 0 || j >= arr.length) return f;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return { ...f, images: arr };
  });

  const uploadFile = async (i, file) => {
    try {
      const r = await API.upload(file);
      updateImage(i, 'url', r.url);
      if (!form.images[i].alt) updateImage(i, 'alt', file.name.replace(/\.[^.]+$/, ''));
    } catch (e) { alert('Ошибка загрузки: ' + e.message); }
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!form.title.trim()) { alert('Заполните название'); return; }
    setBusy(true);
    try { await onSave(form); }
    catch (e) { alert('Ошибка сохранения: ' + e.message); }
    finally { setBusy(false); }
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
      <form onSubmit={submit} onClick={e => e.stopPropagation()} className="bg-paper w-full max-w-3xl rounded-2xl mt-10 mb-10 shadow-2xl">
        <div className="p-6 border-b hairline flex items-center justify-between sticky top-0 bg-paper rounded-t-2xl z-10">
          <h2 className="font-display text-2xl">{initial ? 'Редактирование' : 'Новая работа'}</h2>

        </div>

        <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
          <div className="grid md:grid-cols-2 gap-6">
            <Field label="Название" value={form.title} onChange={v => set('title', v)} />
            <Field label="Slug (URL, опц.)" value={form.slug} onChange={v => set('slug', v)} />

          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <label className="block">
              <span className="text-[11px] uppercase tracking-[0.3em] text-muted">Категория</span>
              <select className="mt-2 w-full bg-transparent border-b hairline py-3 outline-none" value={form.category} onChange={e => set('category', e.target.value)}>
                <option value="original">Оригинал</option>

                <option value="available">Доступно</option>

          </div>

          <div>

</div>
    SEO (Meta)

function AdminAbout() {
  const store = useStore();
  const [form, setForm] = useState(store.about || { artists: [] });

  useEffect(() => { setForm(store.about || { artists: [] }); }, [store.about]);

  const artists = form.artists || [];

  const updateArtist = (i, key, value) => {
    setForm(f => ({
      ...f,
      artists: f.artists.map((a, idx) => idx === i ? { ...a, [key]: value } : a),
    }));
  };

  const addArtist = () => {
    setForm(f => ({
      ...f,
      artists: [...(f.artists || []), { name:'', photo:'', shortBio:'', education:'' }],

    if (!confirm('Удалить этого художника?')) return;
    setForm(f => ({ ...f, artists: f.artists.filter((_, idx) => idx !== i) }));
  };

  const uploadPhoto = async (i, file) => {

      updateArtist(i, 'photo', r.url);
    } catch (e) { alert('Ошибка загрузки: ' + e.message); }
  };

  const save = async () => {
    setBusy(true);
    try { await store.setAbout(form); alert('Сохранено'); }
    catch (e) { alert('Ошибка: ' + e.message); }
    finally { setBusy(false); }

  return (

            <div className="text-[11px] uppercase tracking-[0.3em] text-muted">

          />

          <div className="flex items-end gap-3">

              <Field
                label="URL фотографии"

                onChange={v => updateArtist(i, 'photo', v)}

                type="file"
                accept="image/*"
                className="hidden"

                  const f = e.target.files?.[0];
                  if (f) uploadPhoto(i, f);
                }}

          </div>

          <div>
            <Field
              label="Краткая биография (Enter = перенос строки)"
              textarea
              value={artist.shortBio || ''}
              onChange={v => updateArtist(i, 'shortBio', v)}
            />
            <div className="text-xs text-muted mt-1">

            </div>
          </div>

          <div>
            <Field
              label="Образование (Enter = перенос строки)"

              value={artist.education || ''}

function Routes() {
  const route = useRoute();
  const path = route.split('?')[0];
  const parts = path.split('/').filter(Boolean);

  if (path === '/' || parts.length === 0) return <HomePage />;
  if (parts[0] === 'about') return <AboutPage />;
  if (parts[0] === 'techniques') {
    if (parts[1]) return <TechniqueDetailPage slug={parts[1]} />;
    return <TechniquesPage />;
  }
  if (parts[0] === 'originals') return <CategoryPage category="original" title="Оригиналы" subtitle="Уникальные работы в единственном экземпляре." />;
  if (parts[0] === 'engravings') return <CategoryPage category="engraving" title="Гравюры" subtitle="Тиражные листы: линогравюра, ксилография, офорт." />;
  if (parts[0] === 'reproductions') return <CategoryPage category="reproduction" title="Репродукции" subtitle="Печатные копии в нескольких размерах." />;
  if (parts[0] === 'series') return <SeriesPage />;
  if (parts[0] === 'artworks' && parts[1]) return <ArtworkPage slug={parts[1]} />;
  if (parts[0] === 'contacts') return <ContactsPage />;
  if (parts[0] === 'admin') return <AdminPage />;

  return <div className="py-32 text-center">
    <h1 className="font-display text-5xl">404</h1>
    <button onClick={() => navigate('/')} className="mt-6 text-accent hover:underline">На главную</button>
  </div>;
}

function AppShell() {
  const { loading, error } = useStore();
  if (loading) return <div className="min-h-[60vh] flex items-center justify-center text-muted">Загрузка…</div>;
  if (error) return <div className="min-h-[60vh] flex items-center justify-center text-red-600">Ошибка: {error}</div>;
  return <Routes />;
}

function App() {
  useEffect(() => {
    const route = window.location.hash.replace(/^#/, '') || '/';
    const titles = {
      '/': 'Atelier — портфолио художника',
      '/about': 'О нас — Studio asnieres',
      '/techniques': 'По техникам — Studio asnieres',
      '/originals': 'Оригиналы — Studio asnieres',
      '/engravings': 'Гравюры — Studio asnieres',
      '/reproductions': 'Репродукции — Studio asnieres',
      '/series': 'Серии — Studio asnieres',
      '/contacts': 'Контакты — Studio asnieres',
      '/admin': 'Админ-панель',
    };
    document.title = titles[route] || 'Studio asnieres — Portfolio';
  });

  return (
    <StoreProvider>
      <div className="min-h-screen flex flex-col">
        <Header />
        <main className="flex-1"><AppShell /></main>
        <Footer />
      </div>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
