<!-- ===== API-КЛИЕНТ ===== -->
<script>
  window.API = {
    base: '/api',
    token() { return localStorage.getItem('token'); },
    setToken(t) { t ? localStorage.setItem('token', t) : localStorage.removeItem('token'); },
    async req(path, { method = 'GET', body, headers = {} } = {}) {
      const h = { ...headers };
      if (body && !(body instanceof FormData)) h['Content-Type'] = 'application/json';
      const t = this.token();
      if (t) h['Authorization'] = `Bearer ${t}`;
      const res = await fetch(this.base + path, {
        method, headers: h,
        body: body instanceof FormData ? body : (body ? JSON.stringify(body) : undefined),
      });
      if (res.status === 401) { this.setToken(null); window.dispatchEvent(new Event('auth:logout')); }
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || 'Ошибка запроса');
      }
      return res.status === 204 ? null : res.json();
    },
    login: (email, password) => API.req('/auth/login', { method:'POST', body:{ email, password } }),
    me: () => API.req('/auth/me'),
    listArtworks: (f = {}) => {
      const q = new URLSearchParams(Object.entries(f).filter(([,v]) => v !== undefined && v !== null && v !== '')).toString();
      return API.req('/artworks' + (q ? '?' + q : ''));
    },
    getArtwork: (slug) => API.req(`/artworks/${slug}`),
    createArtwork: (d) => API.req('/artworks', { method:'POST', body:d }),
    updateArtwork: (id, d) => API.req(`/artworks/${id}`, { method:'PUT', body:d }),
    deleteArtwork: (id) => API.req(`/artworks/${id}`, { method:'DELETE' }),
    listTechniques: () => API.req('/techniques'),
    createTechnique: (d) => API.req('/techniques', { method:'POST', body:d }),
    deleteTechnique: (id) => API.req(`/techniques/${id}`, { method:'DELETE' }),
    getAbout: () => API.req('/about'),
    updateAbout: (d) => API.req('/about', { method:'PUT', body:d }),
    getContacts: () => API.req('/contacts'),
    updateContacts: (d) => API.req('/contacts', { method:'PUT', body:d }),
    upload: async (file) => {
      const fd = new FormData(); fd.append('file', file);
      return API.req('/uploads', { method:'POST', body: fd });
    }
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, createContext, useContext, useRef } = React;

/* ============== i18next init ============== */
const { initReactI18next, useTranslation } = window.ReactI18next;

i18next
  .use(initReactI18next)
  .init({
    resources: {
      ru: { translation: window.TRANSLATIONS_RU || {} },
      en: { translation: window.TRANSLATIONS_EN || {} },
      fr: { translation: window.TRANSLATIONS_FR || {} },
    },
    lng: 'ru',
    fallbackLng: 'ru',
    interpolation: { escapeValue: false },
  });

/* ============== Роутер ============== */
const SUPPORTED_LANGS = ['ru', 'en', 'fr'];
const DEFAULT_LANG = 'ru';

function parseHash() {
  return window.location.hash.replace(/^#/, '') || '/';
}

function parseLang(path) {
  const parts = path.split('?')[0].split('/').filter(Boolean);
  if (parts.length && SUPPORTED_LANGS.includes(parts[0])) {
    return {
      lang: parts[0],
      pathWithoutLang: '/' + parts.slice(1).join('/'),
    };
  }
  return { lang: DEFAULT_LANG, pathWithoutLang: path };
}

function useRoute() {
  const [route, setRoute] = useState(parseHash());
  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return route;
}

function navigate(path, lang) {
  const currentLang = parseLang(window.location.hash.replace(/^#/, '') || '/').lang;
  const finalLang = lang || currentLang;
  const clean = path.startsWith('/') ? path : '/' + path;
  const hasLangPrefix = SUPPORTED_LANGS.some(
    l => clean === '/' + l || clean.startsWith('/' + l + '/')
  );
  const fullPath = hasLangPrefix
    ? clean
    : `/${finalLang}${clean === '/' ? '' : clean}`;
  window.location.hash = fullPath;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Редирект со старого формата /xxx на /ru/xxx */
function ensureLangInUrl() {
  const hash = window.location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('?')[0].split('/').filter(Boolean);
  if (!parts.length || !SUPPORTED_LANGS.includes(parts[0])) {
    const query = hash.split('?')[1];
    const newHash = `#/${DEFAULT_LANG}${hash === '/' ? '' : hash}${query ? '?' + query : ''}`;
    window.location.replace(newHash);
  }
}

/* ============== Store ============== */
const StoreCtx = createContext(null);
function useStore() { return useContext(StoreCtx); }

function StoreProvider({ children }) {
  const [artworks, setArtworks] = useState([]);
  const [techniques, setTechniques] = useState([]);
  const [about, setAbout] = useState({});
  const [contacts, setContacts] = useState({});
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const loadAll = async () => {
    try {
      setLoading(true);
      const [a, t, ab, c] = await Promise.all([
        API.listArtworks(),
        API.listTechniques(),
        API.getAbout(),
        API.getContacts(),
      ]);
      setArtworks(a); setTechniques(t); setAbout(ab); setContacts(c);
      setError(null);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  useEffect(() => { loadAll(); }, []);

  const api = {
    loading, error,
    artworks, techniques, about, contacts,
    refresh: loadAll,

    listArtworks: (filters = {}) => {
      let list = [...artworks];
      if (filters.category) list = list.filter(a => a.category === filters.category);
      if (filters.technique) list = list.filter(a => (a.techniques||[]).includes(filters.technique));
      if (filters.year) list = list.filter(a => a.year === Number(filters.year));
      if (filters.available === true) list = list.filter(a => a.status === 'available');
      if (filters.featured) list = list.filter(a => a.featured);
      return list;
    },
    getArtwork: (slug) => artworks.find(a => a.slug === slug),

    createArtwork: async (data) => {
      const created = await API.createArtwork(data);
      setArtworks(prev => [created, ...prev]);
      return created;
    },
    updateArtwork: async (id, data) => {
      const updated = await API.updateArtwork(id, data);
      setArtworks(prev => prev.map(a => a.id === id ? updated : a));
      return updated;
    },
    deleteArtwork: async (id) => {
      await API.deleteArtwork(id);
      setArtworks(prev => prev.filter(a => a.id !== id));
    },

    createTechnique: async (t) => {
      const created = await API.createTechnique(t);
      setTechniques(prev => [...prev, created]);
    },
    deleteTechnique: async (id) => {
      await API.deleteTechnique(id);
      setTechniques(prev => prev.filter(t => t.id !== id));
    },

    setAbout: async (data) => { const saved = await API.updateAbout(data); setAbout(saved); },
    setContacts: async (data) => { const saved = await API.updateContacts(data); setContacts(saved); },
  };

  return <StoreCtx.Provider value={api}>{children}</StoreCtx.Provider>;
}

/* ============== Компоненты ============== */

function LangSwitcher() {
  const route = useRoute();
  const currentLang = parseLang(route).lang;

  const switchTo = (newLang) => {
    const { pathWithoutLang } = parseLang(route);
    navigate(pathWithoutLang || '/', newLang);
  };

  return (
    <div className="flex items-center gap-1 text-xs uppercase tracking-widest">
      {SUPPORTED_LANGS.map((l, i) => (
        <React.Fragment key={l}>
          {i > 0 && <span className="text-muted/40">·</span>}
          <button
            onClick={() => switchTo(l)}
            className={`px-1.5 py-0.5 rounded transition ${
              l === currentLang ? 'text-ink font-medium' : 'text-muted hover:text-ink'
            }`}
          >
            {l}
          </button>
        </React.Fragment>
      ))}
    </div>
  );
}

    { label: t('nav.about'), path: '/about' },
    { label: t('nav.techniques'), path: '/techniques' },
    { label: t('nav.originals'), path: '/originals' },
    { label: t('nav.series'), path: '/series' },
    { label: t('nav.engravings'), path: '/engravings' },
    { label: t('nav.reproductions'), path: '/reproductions' },
    { label: t('nav.contacts'), path: '/contacts' },
  ];

  const { pathWithoutLang } = parseLang(route);
  const isActive = (p) => pathWithoutLang === p || pathWithoutLang.startsWith(p + '/');

  useEffect(() => {
    if (searchOpen && searchInputRef.current) searchInputRef.current.focus();
  }, [searchOpen]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setSearchOpen(false); };
    if (searchOpen) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);

    const q = query.trim();

    setSearchOpen(false);
    setQuery('');

          <div className="text-[10px] tracking-[0.3em] text-muted uppercase -mt-1">{t('common.atelier')}</div>
        </button>

        <nav className="hidden lg:flex items-center gap-8">
          {items.map(i => (
            <button key={i.path} onClick={() => navigate(i.path)}
              className={`text-sm tracking-wide transition-colors ${isActive(i.path) ? 'text-ink' : 'text-muted hover:text-ink'}`}>
              {i.label}
            </button>
          ))}
          <LangSwitcher />
          <button onClick={() => setSearchOpen(true)}
            className="ml-2 w-9 h-9 rounded-full border hairline flex items-center justify-center text-muted hover:text-ink hover:border-ink/40"
            title={t('nav.search')}>
            <Icon.Search className="w-4 h-4" />
          </button>
          <button onClick={() => navigate('/admin')}
            className="w-9 h-9 rounded-full border hairline flex items-center justify-center text-muted hover:text-ink hover:border-ink/40"
            title={t('nav.admin')}>
            <Icon.Lock className="w-4 h-4" />
          </button>
        </nav>

        <div className="lg:hidden flex items-center gap-2">
          <LangSwitcher />
          <button className="p-2" onClick={() => setSearchOpen(true)} aria-label={t('nav.search')}>
            <Icon.Search className="w-5 h-5" />
          </button>
          <button className="p-2" onClick={() => setOpen(true)} aria-label={t('nav.menu')}>
            <Icon.Menu className="w-6 h-6" />
          </button>
        </div>
      </div>

      {open && (
        <div className="fixed inset-0 z-50 bg-paper flex flex-col">
          <div className="h-20 px-6 flex items-center justify-between border-b hairline">
            <div className="font-display text-2xl">{t('nav.menu')}</div>
            <button onClick={() => setOpen(false)} className="p-2"><Icon.Close className="w-6 h-6"/></button>
          </div>
          <nav className="flex-1 flex flex-col items-start justify-center px-8 gap-6">
            {items.map(i => (
              <button key={i.path} onClick={() => { setOpen(false); navigate(i.path); }}
                className="font-display text-4xl tracking-wide hover:text-accent transition">
                {i.label}

            ))}
            <button onClick={() => { setOpen(false); navigate('/admin'); }} className="mt-6 text-sm text-muted inline-flex items-center gap-2">
              <Icon.Lock className="w-4 h-4"/> {t('nav.admin')}
            </button>
          </nav>
        </div>
      )}

      {searchOpen && (
        <div className="fixed inset-0 z-50 bg-black/40 flex items-start justify-center pt-32 px-4"
             onClick={() => setSearchOpen(false)}>
          <form onSubmit={submitSearch} onClick={e => e.stopPropagation()}
            className="bg-paper w-full max-w-2xl rounded-2xl shadow-2xl p-6">
            <div className="flex items-center gap-4">
              <Icon.Search className="w-5 h-5 text-muted" />
              <input
                ref={searchInputRef}
                type="text"
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder={t('nav.search') + '…'}
                className="flex-1 bg-transparent border-none outline-none text-2xl font-display placeholder:text-muted/50"
              />
              <button type="button" onClick={() => setSearchOpen(false)}
                className="text-muted hover:text-ink">
                <Icon.Close className="w-5 h-5" />
              </button>
            </div>
            <div className="mt-4 pt-4 border-t hairline text-xs text-muted">
              Enter — {t('common.send')} · Esc — {t('common.cancel')}
            </div>
          </form>
        </div>
      )}
    </header>
  );
}

function LazyImage({ src, alt, className = '', ratio, fit = 'cover' }) {
  const ref = useRef(null);
  const [loaded, setLoaded] = useState(false);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); io.disconnect(); }
    }, { rootMargin:'200px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <div ref={ref} className={`relative overflow-hidden bg-neutral-200 ${className}`} style={ratio ? { aspectRatio: ratio } : undefined}>
      {visible && src && (
        <img src={src} alt={alt} loading="lazy"
          onLoad={() => setLoaded(true)}
          className={`w-full h-full ${fit === 'contain' ? 'object-contain' : 'object-cover'} transition-opacity duration-700 ${loaded ? 'opacity-100' : 'opacity-0'}`}
        />
      )}
    </div>
  );
}

function ArtworkPage({ slug }) {
  const store = useStore();
  const { t } = useTranslation();
  const a = store.getArtwork(slug);
  const [activeIdx, setActiveIdx] = useState(0);
  const [lightbox, setLightbox] = useState(false);
  useEffect(() => { setActiveIdx(0); }, [slug]);

  // Динамический meta для SEO
  useEffect(() => {
    if (!a) return;
    const title = a.metaTitle || `${a.title}${a.year ? ', ' + a.year : ''} | ${a.artist || ''}`;
    document.title = title;
    const description = a.metaDescription || (a.description || '').slice(0, 160);
    let metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', description);
  }, [a]);

  if (!a) return (
    <div className="max-w-3xl mx-auto py-32 text-center">
      <h1 className="font-display text-4xl mb-4">{t('artwork.notFound')}</h1>
      <button onClick={() => navigate('/')} className="text-accent hover:underline">{t('artwork.toMain')}</button>
    </div>
  );

  const images = Array.isArray(a.images) ? a.images.filter(img => img && img.url) : [];
  const cover = images[activeIdx] || images[0] || { url: '', alt: a.title };

  const all = store.listArtworks({ category: a.category });
  const idx = all.findIndex(x => x.id === a.id);
  const prev = idx > 0 ? all[idx-1] : null;
  const next = idx >= 0 && idx < all.length-1 ? all[idx+1] : null;

  const spec = [
    [t('artwork.artist'), a.artist],
    [t('artwork.year'), a.year],
    [t('artwork.technique'), a.techniqueNames?.join(', ')],
    [t('artwork.material'), a.materials || a.printMaterial],
    a.category === 'engraving' ? [t('artwork.sheetSize'), `${a.sheetHeight}×${a.sheetWidth} см`] : null,
    a.category === 'engraving' ? [t('artwork.imageSize'), `${a.imageHeight}×${a.imageWidth} см`] : null,
    a.category !== 'engraving' ? [t('artwork.size'), `${a.height}×${a.width} см`] : null,
    a.category === 'engraving' ? [t('artwork.edition'), a.edition] : null,
    a.category === 'engraving' ? [t('artwork.copyNumber'), a.copyNumber] : null,
    a.category === 'engraving' ? [t('artwork.signed'), a.signed] : null,
    a.category === 'reproduction' ? [t('artwork.originalTitle'), a.originalTitle] : null,
    a.category === 'reproduction' ? [t('artwork.reproType'), a.reproductionType] : null,
  ].filter(item => item && item[1]);

  const categoryLabel = a.category === 'original'
    ? t('artwork.original')
    : a.category === 'engraving'
      ? t('artwork.engraving')
      : t('artwork.reproduction');

  return (
    <div className="fade-in">
      <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-10">
        <div className="flex items-center justify-between mb-8">
          <button onClick={() => window.history.back()} className="text-sm text-muted inline-flex items-center gap-2 hover:text-ink">
            <Icon.ArrowLeft className="w-4 h-4"/> {t('common.back')}
          </button>
          <div className="text-xs text-muted uppercase tracking-widest">{categoryLabel}</div>
        </div>
      </div>

      <div className="max-w-[1400px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-12">
        <div className="lg:col-span-8">
          <div className="artwork-frame bg-neutral-100 cursor-zoom-in" onClick={() => setLightbox(true)}>
            <LazyImage
              src={cover.url}
              alt={cover.alt || a.title}
              ratio={a.height && a.width ? `${a.width}/${a.height}` : '4/5'}
              fit="contain"
            />
          </div>
          {images.length > 1 && (
            <div className="mt-4 grid grid-cols-5 gap-3">
              {images.map((img, i) => (
                <button key={i} onClick={() => setActiveIdx(i)}
                  className={`overflow-hidden border-2 transition ${i===activeIdx?'border-ink':'border-transparent opacity-70 hover:opacity-100'}`}>
                  <LazyImage src={img.url} alt={img.alt} ratio="1/1" />
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="lg:col-span-4">
          <div className="lg:sticky lg:top-28">
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted">{a.artist}</div>
            <h1 className="font-display text-4xl md:text-5xl mt-3 leading-[1.05]">{a.title}</h1>
            <div className="mt-4 flex items-center gap-4">
              <StatusBadge status={a.status} />
              {a.status === 'available' && (
                <div className="text-lg">
                  {a.price != null ? `${a.price} ${a.currency}` : t('artwork.priceOnRequest')}
                </div>
              )}
            </div>
            <p className="mt-8 text-muted leading-relaxed">{a.description}</p>

            <dl className="mt-10 divide-y hairline border-t hairline">
              {spec.map(([k,v], i) => (
                <div key={i} className="py-3 grid grid-cols-3 gap-4 text-sm">
                  <dt className="text-muted">{k}</dt>
                  <dd className="col-span-2">{v}</dd>
                </div>
              ))}
            </dl>

            {a.category === 'reproduction' && a.availableSizes?.length > 0 && (
              <div className="mt-8 border-t hairline pt-6">
                <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-4">{t('artwork.availableSizes')}</div>
                <div className="space-y-3">
                  {a.availableSizes.map((s, i) => (
                    <div key={i} className="flex items-center justify-between border hairline rounded-xl px-4 py-3">
                      <div className="text-sm">{s.label}</div>
                      <div className="text-sm">{s.price != null ? `${s.price} ${a.currency}` : t('artwork.priceOnRequest')}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {a.status === 'available' && (
              <button
                onClick={() => navigate(`/contacts?artwork=${encodeURIComponent(a.slug)}&title=${encodeURIComponent(a.title)}`)}
                className="mt-8 w-full bg-ink text-paper py-4 rounded-full hover:bg-accent transition"
              >
                {t('artwork.request')}
              </button>
            )}

            {(prev || next) && (
              <div className="mt-12 pt-8 border-t hairline grid grid-cols-2 gap-6">
                {prev ? (
                  <button onClick={() => navigate(`/artworks/${prev.slug}`)} className="text-left group">
                    <div className="text-[10px] uppercase tracking-widest text-muted mb-2">← {t('common.prev')}</div>
                    <div className="font-display text-lg group-hover:text-accent transition">{prev.title}</div>
                  </button>

                  <button onClick={() => navigate(`/artworks/${next.slug}`)} className="text-right group">
                    <div className="text-[10px] uppercase tracking-widest text-muted mb-2">{t('common.next')} →</div>
                    <div className="font-display text-lg group-hover:text-accent transition">{next.title}</div>
                  </button>
                ) : <div />}
              </div>

      </div>

      {lightbox && cover.url && (

function SearchPage({ query }) {
  const store = useStore();
  const { t } = useTranslation();
  const [input, setInput] = useState(query || '');
  const q = (query || '').trim().toLowerCase();

  const results = q
    ? store.artworks.filter(a => {
        const haystack = [
          a.title, a.description, a.artist, a.materials,
          a.techniqueNames?.join(' '), a.category,
        ].filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(q);
      })
    : [];

  const submit = (e) => {
    e.preventDefault();
    const v = input.trim();
    if (!v) return;
    navigate(`/search?q=${encodeURIComponent(v)}`);
  };

  return (
    <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-16">
      <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-6">{t('nav.search')}</div>

          <input
            type="text"
            value={input}

          />

            <button type="button" onClick={() => setInput('')} className="text-muted hover:text-ink">
              <Icon.Close className="w-5 h-5" />
            </button>
          )}
        </div>
      </form>
      {!q && <div className="text-center py-20 text-muted">{t('nav.search')}…</div>}
      {q && results.length === 0 && (
        <div className="text-center py-20">
          <div className="font-display text-4xl mb-4">{t('artwork.notFound')}</div>
          <p className="text-muted">«{query}»</p>

  );

function ContactsPage() {
  const { contacts } = useStore();
  const { t } = useTranslation();
  const route = useRoute();
  const params = useMemo(() => {
    const q = route.split('?')[1] || '';
    return new URLSearchParams(q);
  }, [route]);

  const artworkSlug = params.get('artwork') || '';
  const artworkTitle = params.get('title') || '';

  const [form, setForm] = useState({
    name: '',
    email: '',
    message: artworkTitle
      ? `${t('contacts.requestAbout')} «${artworkTitle}».`
      : '',
    artwork: artworkSlug,
  });
  const [sent, setSent] = useState(false);
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (artworkTitle) {
      setForm(f => ({
        ...f,
        artwork: artworkSlug,
        message: f.message || `${t('contacts.requestAbout')} «${artworkTitle}».`,
      }));
    }
  }, [artworkSlug, artworkTitle]);

  const submit = async (e) => {
    e.preventDefault();
    const errs = {};
    if (!form.name.trim()) errs.name = t('contacts.errorName');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) errs.email = t('contacts.errorEmail');
    if (form.message.trim().length < 5) errs.message = t('contacts.errorMessage');
    setErrors(errs);
    if (Object.keys(errs).length) return;

    setBusy(true);
    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.name,
          email: form.email,
          message: form.message,
          artwork: form.artwork || null,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || t('contacts.errorSend'));
      }
      setSent(true);
      setForm({ name:'', email:'', message:'', artwork:'' });
    } catch (err) {
      setErrors({ form: err.message });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-[1400px] mx-auto px-6 lg:px-10 py-16">
      <SectionTitle

              <Field label={t('contacts.name')} value={form.name} onChange={v => setForm({...form, name:v})} error={errors.name} />
              <Field label={t('contacts.email')} type="email" value={form.email} onChange={v => setForm({...form, email:v})} error={errors.email} />
              <Field label={t('contacts.message')} textarea value={form.message} onChange={v => setForm({...form, message:v})} error={errors.message} />
              {errors.form && <div className="text-sm text-red-600">{errors.form}</div>}
              <button type="submit" disabled={busy}
                className="inline-flex items-center gap-3 bg-ink text-paper px-8 py-4 rounded-full hover:bg-accent transition disabled:opacity-50">
                {busy ? t('common.sending') : t('common.send')} <Icon.Arrow className="w-4 h-4"/>
              </button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, error, textarea, type='text' }) {
  const cls = `w-full bg-transparent border-b ${error?'border-red-400':'border-[rgba(26,26,26,.25)]'} focus:border-ink outline-none py-3 transition`;
  return (
    <label className="block">
      <span className="text-[11px] uppercase tracking-[0.3em] text-muted">{label}</span>
      <div className="mt-2">
        {textarea
          ? <textarea rows="5" className={cls} value={value} onChange={e => onChange(e.target.value)} />
          : <input type={type} className={cls} value={value} onChange={e => onChange(e.target.value)} />}
      </div>
      {error && <span className="text-xs text-red-600 mt-1 block">{error}</span>}
    </label>
  );
}

function AdminPage() {
  const { t } = useTranslation();
  const [authed, setAuthed] = useState(() => !!API.token());
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    let alive = true;
    if (API.token()) {
      API.me()
        .then(() => { if (alive) setAuthed(true); })
        .catch(() => { API.setToken(null); if (alive) setAuthed(false); })
        .finally(() => { if (alive) setChecking(false); });
    } else setChecking(false);
    return () => { alive = false; };
  }, []);

  if (checking) return <div className="py-32 text-center text-muted">{t('admin.checking')}</div>;
  if (!authed) return <AdminLogin onLogin={() => setAuthed(true)} />;
  return <AdminPanel onLogout={() => { API.setToken(null); setAuthed(false); }} />;
}

function AdminLogin({ onLogin }) {
  const { t } = useTranslation();
  const [email, setEmail] = useState('admin@studio.art');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      const { token } = await API.login(email, password);
      API.setToken(token);
      onLogin();
    } catch (e) { setErr(e.message || 'Ошибка'); }
    finally { setBusy(false); }
  };

  return (
    <div className="min-h-[70vh] flex items-center justify-center px-6">
      <form onSubmit={submit} className="w-full max-w-md border hairline rounded-2xl p-10 bg-white/60">
        <div className="w-12 h-12 rounded-full bg-ink text-paper flex items-center justify-center mb-6">
          <Icon.Lock className="w-5 h-5"/>
        </div>
        <h1 className="font-display text-3xl">{t('admin.title')}</h1>
        <p className="text-sm text-muted mt-2">{t('admin.loginHint')}</p>
        <div className="mt-8 space-y-6">
          <Field label={t('admin.email')} type="email" value={email} onChange={setEmail} />
          <Field label={t('admin.password')} type="password" value={password} onChange={setPassword} error={err} />
        </div>
        <button disabled={busy} className="mt-8 w-full bg-ink text-paper py-3.5 rounded-full hover:bg-accent transition disabled:opacity-50">
          {busy ? '…' : t('admin.loginBtn')}
        </button>
      </form>
    </div>
  );
}

function ArtworkForm({ initial, onClose, onSave }) {
  const store = useStore();
  const empty = {
    slug:'', artist:'Анна Морозова', title:'', year: new Date().getFullYear(),
    category:'original', techniques:[], materials:'', height:0, width:0,
    description:'', status:'available', price:null, currency:'EUR',
    images:[{ url:'', alt:'' }], featured:false,
    sheetHeight:0, sheetWidth:0, imageHeight:0, imageWidth:0,
    edition:null, copyNumber:'', signed:'',
    metaTitle:'', metaDescription:'', series:'',
  };
  const [form, setForm] = useState(initial ? { ...empty, ...initial } : empty);
  const [busy, setBusy] = useState(false);
  const set = (k,v) => setForm(f => ({ ...f, [k]:v }));

  const toggleTech = (slug) => setForm(f => ({
    ...f,
    techniques: f.techniques.includes(slug) ? f.techniques.filter(x => x!==slug) : [...f.techniques, slug]
  }));

  const addImage = () => setForm(f => ({ ...f, images: [...f.images, { url:'', alt:'' }] }));
  const updateImage = (i, k, v) => setForm(f => ({ ...f, images: f.images.map((img, idx) => idx===i ? { ...img, [k]:v } : img) }));
  const removeImage = (i) => setForm(f => ({ ...f, images: f.images.filter((_, idx) => idx !== i) }));
  const moveImage = (i, dir) => setForm(f => {
    const arr = [...f.images]; const j = i + dir;
    if (j < 0 || j >= arr.length) return f;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return { ...f, images: arr };
  });

  const uploadFile = async (i, file) => {
    try {
      const r = await API.upload(file);
      updateImage(i, 'url', r.url);
      if (!form.images[i].alt) updateImage(i, 'alt', file.name.replace(/\.[^.]+$/, ''));
    } catch (e) { alert('Ошибка загрузки: ' + e.message); }
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!form.title.trim()) { alert('Заполните название'); return; }
    setBusy(true);
    try { await onSave(form); }
    catch (e) { alert('Ошибка сохранения: ' + e.message); }
    finally { setBusy(false); }
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-4 overflow-y-auto" onClick={onClose}>
      <form onSubmit={submit} onClick={e => e.stopPropagation()} className="bg-paper w-full max-w-3xl rounded-2xl mt-10 mb-10 shadow-2xl">
        <div className="p-6 border-b hairline flex items-center justify-between sticky top-0 bg-paper rounded-t-2xl z-10">
          <h2 className="font-display text-2xl">{initial ? 'Edit' : 'New'}</h2>
          <button type="button" onClick={onClose}><Icon.Close className="w-6 h-6"/></button>
        </div>
        <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
          <div className="grid md:grid-cols-2 gap-6">
            <Field label="Название" value={form.title} onChange={v => set('title', v)} />
            <Field label="Slug" value={form.slug} onChange={v => set('slug', v)} />
            <Field label="Автор" value={form.artist} onChange={v => set('artist', v)} />
            <Field label="Год" type="number" value={form.year} onChange={v => set('year', Number(v))} />
          </div>
          <div className="grid md:grid-cols-2 gap-6">
            <label className="block">
              <span className="text-[11px] uppercase tracking-[0.3em] text-muted">Категория</span>
              <select className="mt-2 w-full bg-transparent border-b hairline py-3 outline-none" value={form.category} onChange={e => set('category', e.target.value)}>
                <option value="original">Оригинал</option>
                <option value="engraving">Гравюра</option>
                <option value="reproduction">Репродукция</option>
              </select>
            </label>
            <label className="block">
              <span className="text-[11px] uppercase tracking-[0.3em] text-muted">Статус</span>
              <select className="mt-2 w-full bg-transparent border-b hairline py-3 outline-none" value={form.status} onChange={e => set('status', e.target.value)}>
                <option value="available">Доступно</option>
                <option value="sold">Продано</option>
                <option value="not_for_sale">Не продаётся</option>
              </select>
            </label>
          </div>
          <div>
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted mb-3">Техники</div>
            <div className="flex flex-wrap gap-2">
              {store.techniques.map(tech => (
                <button type="button" key={tech.slug} onClick={() => toggleTech(tech.slug)}
                  className={`px-4 py-2 rounded-full border text-sm transition ${form.techniques.includes(tech.slug)?'bg-ink text-paper border-ink':'border-[rgba(26,26,26,.15)] hover:border-ink'}`}>
                  {tech.name}
                </button>
              ))}
            </div>
          </div>
          <div className="grid md:grid-cols-2 gap-6">
            <Field label="Материал" value={form.materials||''} onChange={v => set('materials', v)} />
            <div className="grid grid-cols-2 gap-4">
              <Field label="Высота, см" type="number" value={form.height||0} onChange={v => set('height', Number(v))} />
              <Field label="Ширина, см" type="number" value={form.width||0} onChange={v => set('width', Number(v))} />
            </div>
          </div>
          {form.category === 'engraving' && (
            <div className="border hairline rounded-xl p-5 space-y-4">
              <div className="text-[11px] uppercase tracking-[0.3em] text-muted">Параметры гравюры</div>
              <div className="grid md:grid-cols-2 gap-6">
                <div className="grid grid-cols-2 gap-4">
                  <Field label="Л. высота" type="number" value={form.sheetHeight||0} onChange={v => set('sheetHeight', Number(v))} />
                  <Field label="Л. ширина" type="number" value={form.sheetWidth||0} onChange={v => set('sheetWidth', Number(v))} />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <Field label="Из. высота" type="number" value={form.imageHeight||0} onChange={v => set('imageHeight', Number(v))} />
                  <Field label="Из. ширина" type="number" value={form.imageWidth||0} onChange={v => set('imageWidth', Number(v))} />
                </div>
                <Field label="Тираж" type="number" value={form.edition ?? ''} onChange={v => set('edition', Number(v)||null)} />
                <Field label="Номер экз." value={form.copyNumber||''} onChange={v => set('copyNumber', v)} />
                <div className="md:col-span-2">
                  <Field label="Подпись" value={form.signed||''} onChange={v => set('signed', v)} />
                </div>
              </div>
            </div>
          )}
          <Field label="Описание" textarea value={form.description||''} onChange={v => set('description', v)} />
          <div className="border-t hairline pt-6">
            <Field label="Серия" value={form.series || ''} onChange={v => set('series', v)} />
            <div className="text-xs text-muted mt-2">Например: «Портовые этюды». Оставьте пусто, если вне серии.</div>
          </div>
          <div className="grid md:grid-cols-3 gap-6">
            <Field label="Цена" type="number" value={form.price ?? ''} onChange={v => set('price', v === '' ? null : Number(v))} />
            <Field label="Валюта" value={form.currency} onChange={v => set('currency', v)} />
            <label className="flex items-center gap-3 pt-6">
              <input type="checkbox" checked={form.featured} onChange={e => set('featured', e.target.checked)} />
              <span className="text-sm">На главной</span>
            </label>
          </div>
          <div className="border-t hairline pt-6 space-y-4">
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted">SEO (Meta)</div>
            <Field label="Meta Title" value={form.metaTitle || ''} onChange={v => set('metaTitle', v)} />
            <Field label="Meta Description" textarea value={form.metaDescription || ''} onChange={v => set('metaDescription', v)} />
          </div>
          <div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-[11px] uppercase tracking-[0.3em] text-muted">Изображения</div>
              <button type="button" onClick={addImage} className="text-sm text-accent hover:underline">+</button>
            </div>
            <div className="space-y-3">
              {form.images.map((img, i) => (
                <div key={i} className="border hairline rounded-xl p-3 grid grid-cols-12 gap-3 items-start">
                  <div className="col-span-2">
                    <div className="aspect-square bg-neutral-100 rounded overflow-hidden">
                      {img.url && <img src={img.url} alt="" className="w-full h-full object-cover"/>}
                    </div>
                    <div className="text-[10px] text-center mt-1 text-muted">{i===0?'main':`#${i+1}`}</div>
                  </div>
                  <div className="col-span-8 space-y-2">
                    <div className="flex gap-2 items-center">
                      <input placeholder="URL" value={img.url} onChange={e => updateImage(i,'url',e.target.value)}
                        className="flex-1 bg-transparent border-b hairline py-2 text-sm outline-none"/>
                      <label className="text-xs cursor-pointer px-3 py-1.5 rounded-full border hairline hover:border-ink whitespace-nowrap">
                        Загрузить
                        <input type="file" accept="image/*" className="hidden"
                          onChange={e => { const f = e.target.files?.[0]; if (f) uploadFile(i, f); }}/>
                      </label>

                    <input placeholder="Alt" value={img.alt} onChange={e => updateImage(i,'alt',e.target.value)}
                      className="w-full bg-transparent border-b hairline py-2 text-sm outline-none"/>

                    <button type="button" onClick={() => moveImage(i,-1)} className="border hairline rounded px-2 py-1 hover:bg-white">↑</button>
                    <button type="button" onClick={() => moveImage(i,1)} className="border hairline rounded px-2 py-1 hover:bg-white">↓</button>
                    {form.images.length > 1 && (
                      <button type="button" onClick={() => removeImage(i)} className="border border-red-200 text-red-600 rounded px-2 py-1 hover:bg-red-50">✕</button>
                    )}

                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="p-6 border-t hairline flex justify-end gap-3 bg-paper rounded-b-2xl">
          <button type="button" onClick={onClose} className="px-5 py-2.5 rounded-full border hairline hover:border-ink/50">Отмена</button>
          <button disabled={busy} className="bg-ink text-paper px-5 py-2.5 rounded-full hover:bg-accent transition disabled:opacity-50">
            {busy ? '…' : 'Сохранить'}
          </button>
        </div>
      </form>
    </div>
  );
}

  const [form, setForm] = useState(store.about || { artists: [] });
  const [busy, setBusy] = useState(false);
  useEffect(() => { setForm(store.about || { artists: [] }); }, [store.about]);

  const artists = form.artists || [];
  const updateArtist = (i, key, value) => setForm(f => ({
    ...f,
    artists: f.artists.map((a, idx) => idx === i ? { ...a, [key]: value } : a),
  }));
  const addArtist = () => setForm(f => ({
    ...f,
    artists: [...(f.artists || []), { name:'', photo:'', shortBio:'', education:'' }],
  }));
  const removeArtist = (i) => {
    if (!confirm('?')) return;
    setForm(f => ({ ...f, artists: f.artists.filter((_, idx) => idx !== i) }));
  };
  const uploadPhoto = async (i, file) => {
    try { const r = await API.upload(file); updateArtist(i, 'photo', r.url); }
    catch (e) { alert('Ошибка: ' + e.message); }
  };
  const save = async () => {
    setBusy(true);
    try { await store.setAbout(form); alert('Сохранено'); }
    catch (e) { alert('Ошибка: ' + e.message); }
    finally { setBusy(false); }
  };

  return (
    <div className="max-w-4xl space-y-10">
      <div className="flex items-center justify-between">
        <h3 className="font-display text-2xl">Художники</h3>
        <button onClick={addArtist} className="bg-ink text-paper px-5 py-2.5 rounded-full text-sm hover:bg-accent transition">+</button>
      </div>
      {artists.map((artist, i) => (
        <div key={i} className="border hairline rounded-2xl p-6 space-y-6 bg-white/40">
          <div className="flex items-center justify-between">
            <div className="text-[11px] uppercase tracking-[0.3em] text-muted">Художник #{i + 1}</div>
            {artists.length > 1 && (
              <button onClick={() => removeArtist(i)} className="text-red-600 hover:underline text-sm">✕</button>
            )}
          </div>
          <Field label="Имя" value={artist.name || ''} onChange={v => updateArtist(i, 'name', v)} />
          <div className="flex items-end gap-3">
            <div className="flex-1">
              <Field label="URL фотографии" value={artist.photo || ''} onChange={v => updateArtist(i, 'photo', v)} />
            </div>
            <label className="text-xs cursor-pointer px-3 py-2 mb-1 rounded-full border hairline hover:border-ink whitespace-nowrap">
              Загрузить
              <input type="file" accept="image/*" className="hidden"
                onChange={e => { const f = e.target.files?.[0]; if (f) uploadPhoto(i, f); }}/>
            </label>
          </div>
          <Field label="Краткая биография" textarea value={artist.shortBio || ''} onChange={v => updateArtist(i, 'shortBio', v)} />
          <Field label="Образование" textarea value={artist.education || ''} onChange={v => updateArtist(i, 'education', v)} />
        </div>
      ))}
      <button disabled={busy} onClick={save}
        className="bg-ink text-paper px-6 py-3 rounded-full hover:bg-accent transition disabled:opacity-50">
        {busy ? '…' : 'Сохранить'}
      </button>
    </div>
  );
}

function AdminContacts() {
  const store = useStore();
  const [form, setForm] = useState(store.contacts);
  const [busy, setBusy] = useState(false);
  useEffect(() => { setForm(store.contacts); }, [store.contacts]);
  const set = (k,v) => setForm(f => ({ ...f, [k]:v }));
  return (
    <div className="max-w-2xl space-y-6">
      <Field label="E-mail" value={form.email||''} onChange={v => set('email', v)} />
      <Field label="Instagram" value={form.instagram||''} onChange={v => set('instagram', v)} />
      <Field label="Instagram URL" value={form.instagramUrl||''} onChange={v => set('instagramUrl', v)} />
      <Field label="Telegram" value={form.telegram||''} onChange={v => set('telegram', v)} />
      <Field label="Город" value={form.city||''} onChange={v => set('city', v)} />
      <button disabled={busy} onClick={async () => {
        setBusy(true);
        try { await store.setContacts(form); alert('Сохранено'); }
        catch (e) { alert('Ошибка: ' + e.message); }
        finally { setBusy(false); }
      }} className="bg-ink text-paper px-6 py-3 rounded-full hover:bg-accent transition disabled:opacity-50">
        {busy ? '…' : 'Сохранить'}
      </button>
    </div>
  );
}

/* ============== Routes ============== */

function Routes() {
  const route = useRoute();
  const { pathWithoutLang } = parseLang(route);
  const queryString = route.split('?')[1] || '';
  const path = pathWithoutLang.split('?')[0];
  const parts = path.split('/').filter(Boolean);

  if (path === '/' || parts.length === 0) return <HomePage />;
  if (parts[0] === 'about') return <AboutPage />;
  if (parts[0] === 'techniques') {
    if (parts[1]) return <TechniqueDetailPage slug={parts[1]} />;
    return <TechniquesPage />;
  }
  if (parts[0] === 'originals')
    return <CategoryPage category="original" titleKey="category.originals" subtitleKey="category.originalsSub" />;
  if (parts[0] === 'engravings')
    return <CategoryPage category="engraving" titleKey="category.engravings" subtitleKey="category.engravingsSub" />;
  if (parts[0] === 'reproductions')
    return <CategoryPage category="reproduction" titleKey="category.reproductions" subtitleKey="category.reproductionsSub" />;
  if (parts[0] === 'series') return <SeriesPage />;
  if (parts[0] === 'artworks' && parts[1]) return <ArtworkPage slug={parts[1]} />;
  if (parts[0] === 'contacts') return <ContactsPage />;
  if (parts[0] === 'search') {
    const q = new URLSearchParams(queryString).get('q') || '';
    return <SearchPage query={q} />;
  }
  if (parts[0] === 'admin') return <AdminPage />;

  return (
    <div className="py-32 text-center">
      <h1 className="font-display text-5xl">404</h1>
      <button onClick={() => navigate('/')} className="mt-6 text-accent hover:underline">←</button>
    </div>
  );
}

function AppShell() {
  const { loading, error } = useStore();
  if (loading) return <div className="min-h-[60vh] flex items-center justify-center text-muted">…</div>;
  if (error) return <div className="min-h-[60vh] flex items-center justify-center text-red-600">{error}</div>;
  return <Routes />;
}

function App() {
  // Редирект со старого формата URL на /ru/...
  useEffect(() => {
    ensureLangInUrl();
  }, []);

  const route = useRoute();
  const { lang } = parseLang(route);

  // Синхронизируем язык
  useEffect(() => {
    if (i18next.language !== lang) i18next.changeLanguage(lang);
    document.documentElement.lang = lang;
  }, [lang]);

  return (
    <StoreProvider>
      <div className="min-h-screen flex flex-col">
        <Header />
        <main className="flex-1"><AppShell /></main>
        <Footer />
      </div>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
